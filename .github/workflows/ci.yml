name: CI

on:
  pull_request:
  push:
    branches: [dev, prod]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke and self-contained Agent2 tests
        run: >-
          python -m unittest -v
          tests.test_smoke
          tests.test_agent2_s1
          tests.test_agent2_m06
          tests.test_agent2_web
          tests.test_agent2_orchestration
