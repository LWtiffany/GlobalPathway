name: CI

on:
  pull_request:
  push:
    branches: [dev, prod]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check production Python modules
        run: |
          python -m compileall -q agent1 agent2 admin_console
          python -c "import agent1, agent2, admin_console"
      - name: Check browser JavaScript
        run: node --check agent2/web/app.js
