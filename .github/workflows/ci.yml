name: CI

on:
  pull_request:
  push:
    branches: [dev, prod]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke tests (import + config + schema)
        run: python -m unittest discover -s tests -p test_smoke.py -v
