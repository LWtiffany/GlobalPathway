name: Deploy prod

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/lwtiffany/globalpathway

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push admin
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.admin
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/admin:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/admin:latest
      - name: Build and push agent1
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.agent1
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/agent1:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/agent1:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
      contents: read
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_DEPLOY_KEY }}
          envs: GH_TOKEN
          script: |
            set -e
            cd /srv/globalpathway
            echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
            export ADMIN_IMAGE=${{ env.IMAGE_BASE }}/admin:${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull admin
            docker compose -f docker-compose.prod.yml up -d admin
            docker pull ${{ env.IMAGE_BASE }}/agent1:${{ github.sha }}
            docker tag ${{ env.IMAGE_BASE }}/agent1:${{ github.sha }} ${{ env.IMAGE_BASE }}/agent1:latest
            curl -fsS http://127.0.0.1:8765/healthz

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: curl -fsS "https://${{ secrets.ECS_HOST }}/healthz" || exit 1
