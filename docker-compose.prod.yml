services:
  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/lwtiffany/globalpathway/admin:latest}
    build:
      context: .
      dockerfile: Dockerfile.admin
    network_mode: host
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  user:
    image: ${USER_IMAGE:-ghcr.io/lwtiffany/globalpathway/user:latest}
    build:
      context: .
      dockerfile: Dockerfile.user
    network_mode: host
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
