# 同一 IP、同一 HTTPS 端口上的两个独立服务：用户端在 /，管理员端在 /admin/。
server {
    listen 80 default_server;
    server_name 123.56.13.78;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 公网入口：
#   用户端：https://123.56.13.78/
#   管理员端：https://123.56.13.78/admin/
server {
    listen 443 ssl default_server;
    server_name 123.56.13.78;

    ssl_certificate /etc/letsencrypt/live/123.56.13.78/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/123.56.13.78/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 管理员前端使用 /admin/ 前缀；尾部斜杠让 Nginx 转发时去掉该前缀。
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 管理员前端使用绝对 API 路径，必须在用户端通配规则之前单独分流。
    location ^~ /v1/admin/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 用户前端、用户 API 与用户健康检查。
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
}
